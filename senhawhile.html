<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let senha = prompt("Digite a sua senha: ")
        let contador = 0;
        while (senha !== "abacaxi"){
            alert("senha errada");
            contador ++;
            senha = prompt("Tente novamente");
        }
        alert("Acesso liberado");
    </script>
</body>
</html>
