<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> par ou impar</h1>
    <script>
       let n = Number(prompt("Digite um numero: "))
       
       if (n % 2 === 0){
        alert("numero par")
       } else if (n % 2 === 1){
        alert("numero impar")
       } else{
        alert("Insira em valor valido")
       }
    </script>
</body>
</html>
