<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calculadora</h1>
    <script>
        let n1 = Number(prompt("Digite um numero:"));
        let op = prompt("Operação: '+', '-', '*', '/'")
        let n2 = Number(prompt("Digite um numero:"))
        switch(op){
            case "+":
                alert(n1 + n2);
                break
            case "-":
                alert(n1 - n2);
                break
            case "*":
                alert(n1 * n2);
                break
            case "/":
                alert(n1 / n2);
                break
                default:
                    alert("Digite um op valida")
        }
    </script>
</body>
</html>
