<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <h1>Boletinho</h1>
    <script>
        let nota = Number(prompt("Digite a sua nota: "))

        if (nota >= 9.5 && nota <= 10){
            alert("Excelente")
        }else if(nota >= 7){
            alert("Muito bom")
        }else if (nota >= 5.5){
            alert("Você está quase lá")
        }else if(nota >= 3){
            alert("Vamos estudar mais!")
        }else if(nota >= 0){
            alert("Você esta de recuperação")
        }else{
            alert("Digite um numero valido!")
        }
    </script>
</body>
</html>
